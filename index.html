<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETH Mainnet On-Chain Layer Downloader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .form-box { background: #1e293b; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; }
    button { background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .status { text-align: center; color: #38bdf8; margin: 15px 0; word-break: break-all; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .svg-container { width: 140px; height: 140px; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; border: 1px dashed #334155; }
    .svg-container svg { width: 100%; height: 100%; object-fit: contain; }
    .dl-btn { background: #10b981; margin-top: 10px; width: 100%; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ETH On-Chain Layer Downloader</h1>
    
    <div class="form-box">
      <input type="text" id="rpcUrl" placeholder="ETH Mainnet RPC URL" />
      <input type="text" id="contractAddress" placeholder="Contract Address (0x312...)" />
      <button onclick="fetchLayers()">Fetch Layers</button>
    </div>

    <div class="status" id="status"></div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    // Exact struct definition for diamond facets / custom token storage
    const abi = [
      "function traitTypes(uint256, uint256) view returns (tuple(string traitName, string traitType, string[] pixels, uint256[] pixelCount))",
      "function traitTypes(uint256, uint256) view returns (tuple(string traitName, string traitType, bytes pixels))"
    ];

    async function fetchLayers() {
      const rpc = document.getElementById('rpcUrl').value.trim();
      const addr = document.getElementById('contractAddress').value.trim();
      const status = document.getElementById('status');
      const grid = document.getElementById('grid');

      grid.innerHTML = "";
      if (!rpc || !addr) return alert("RPC URL and Address required!");

      status.innerText = "Connecting to ETH Mainnet...";

      try {
        const provider = new ethers.JsonRpcProvider(rpc);
        const contract = new ethers.Contract(addr, abi, provider);

        let totalLoaded = 0;

        for (let categoryIdx = 0; categoryIdx < 15; categoryIdx++) {
          let hasItemsInCat = false;

          for (let traitIdx = 0; traitIdx < 50; traitIdx++) {
            status.innerText = `Scanning Category [${categoryIdx}] - Trait [${traitIdx}]...`;

            try {
              const res = await contract.traitTypes(categoryIdx, traitIdx);

              if (res) {
                const name = res.traitName || res[0] || "";
                const type = res.traitType || res[1] || `Cat ${categoryIdx}`;
                let rawPixels = res.pixels || res[2] || "";

                if (Array.isArray(rawPixels)) {
                  rawPixels = rawPixels.join("");
                }

                if (!name && !rawPixels) continue;

                hasItemsInCat = true;
                totalLoaded++;

                // Build SVG markup if not already enclosed
                let formattedSvg = "";
                if (typeof rawPixels === 'string' && rawPixels.includes("<svg")) {
                  formattedSvg = rawPixels;
                } else {
                  formattedSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">${rawPixels}</svg>`;
                }

                addCard(type, name || `Trait ${traitIdx}`, formattedSvg, categoryIdx, traitIdx);
              }
            } catch (err) {
              // If index out of bounds, step out of this category iteration
              break;
            }
          }
        }

        status.innerText = totalLoaded > 0 
          ? `Success! Loaded ${totalLoaded} layers.` 
          : "No layers found. Check if the RPC key has active rate-limits or if Etherscan verified ABI differs.";

      } catch (err) {
        console.error(err);
        status.innerText = "Error: " + (err.reason || err.message);
      }
    }

    function addCard(category, name, svg, catIdx, traitIdx) {
      const grid = document.getElementById('grid');
      card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="svg-container">${svg}</div>
        <strong style="font-size: 11px; color: #38bdf8; text-transform: uppercase;">${category}</strong>
        <span style="font-size: 14px; font-weight: bold; margin-top: 4px; text-align: center;">${name}</span>
        <button class="dl-btn" onclick="download('${catIdx}_${traitIdx}_${name}', \`${encodeURIComponent(svg)}\`)">Download SVG</button>
      `;
      grid.appendChild(card);
    }

    function download(filename, encodedSvg) {
      const blob = new Blob([decodeURIComponent(encodedSvg)], { type: "image/svg+xml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${filename}.svg`;
      a.click();
    }
  </script>
</body>
</html>
