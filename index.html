<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>On-Chain Raw Layer Extractor & NFT Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
  body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
  .box { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
  input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; }
  button { background: #007acc; cursor: pointer; font-weight: bold; }
  button:hover { background: #005999; }
  #log { background: #000; padding: 10px; font-family: monospace; height: 150px; overflow-y: auto; border: 1px solid #333; color: #00ff00; }
  .layer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .layer-card { border: 1px solid #444; padding: 5px; text-align: center; border-radius: 4px; background: #252525; }
</style>
</head>
<body>
  <h2>🎨 Raw On-Chain Trait/Layer Extractor</h2>
  
  <div class="box">
    <h3>1. Network & Contract Setup</h3>
    <input id="rpcUrl" placeholder="RPC URL (e.g. https://rpc.ankr.com/eth)" value="https://rpc.ankr.com/eth">
    <input id="contractAddr" placeholder="Diamond Contract Address (0x...)">
  </div>

  <div class="box">
    <h3>2. Raw Layers Extractor (No Token ID Needed)</h3>
    <button onclick="extractAllLayers()">Extract & Download All Layers (.ZIP)</button>
  </div>

  <div class="box">
    <h3>3. Console Logs</h3>
    <div id="log">Ready to extract raw layers...<br></div>
  </div>

  <div class="box">
    <h3>Extracted Layers Preview</h3>
    <div id="preview" class="layer-grid"></div>
  </div>

<script>
  // ABI matching LibAppStorage Trait Struct & Facet Read Functions
  const CONTRACT_ABI = [
    "function getTrait(uint256 _traitTypeIndex, uint256 _traitIndex) external view returns (tuple(string traitName, string traitType, string[] pixels, uint256[] pixelCount))",
    "function getTraitAmount(uint256 _traitTypeIndex) external view returns (uint256)"
  ];

  function log(msg) {
    const l = document.getElementById('log');
    l.innerHTML += `> ${msg}<br>`;
    l.scrollTop = l.scrollHeight;
  }

  // Raw Pixel Data to SVG Renderer Function
  function buildSvgFromPixels(pixels, pixelCount) {
    let rects = "";
    let ptr = 0;
    for (let i = 0; i < pixelCount.length; i++) {
      const count = pixelCount[i];
      const color = pixels[i];
      for (let j = 0; j < count; j++) {
        const x = ptr % 32; // Assuming standard 32x32 pixel grid
        const y = Math.floor(ptr / 32);
        rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${color}" />`;
        ptr++;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">${rects}</svg>`;
  }

  async function extractAllLayers() {
    try {
      const rpc = document.getElementById('rpcUrl').value;
      const addr = document.getElementById('contractAddr').value;
      if (!addr) return alert("Contract address is required!");

      const provider = new ethers.providers.JsonRpcProvider(rpc);
      const contract = new ethers.Contract(addr, CONTRACT_ABI, provider);

      const zip = new JSZip();
      log("Connecting to Contract...");

      // Assuming up to 10 Trait Categories (e.g. Background, Eyes, Hats etc.)
      for (let typeIdx = 0; typeIdx < 10; typeIdx++) {
        try {
          const totalInType = await contract.getTraitAmount(typeIdx);
          if (totalInType == 0) continue;

          log(`Found Category Index ${typeIdx}: ${totalInType} traits`);

          for (let traitIdx = 0; traitIdx < totalInType; traitIdx++) {
            const trait = await contract.getTrait(typeIdx, traitIdx);
            
            // Generate Raw SVG string from structural pixel data
            const svgContent = buildSvgFromPixels(trait.pixels, trait.pixelCount);
            
            const folderName = trait.traitType || `Category_${typeIdx}`;
            const fileName = `${trait.traitName || `Trait_${traitIdx}`}.svg`;

            // Add SVG File to ZIP under Category Folder
            zip.folder(folderName).file(fileName, svgContent);

            // Append Preview Card
            const previewEl = document.getElementById('preview');
            const card = document.createElement('div');
            card.className = 'layer-card';
            card.innerHTML = `${svgContent}<small>${folderName}/<br>${trait.traitName}</small>`;
            previewEl.appendChild(card);
          }
        } catch (e) {
          // Break when non-existent trait category is reached
          break;
        }
      }

      log("Compressing layers into ZIP...");
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, "OnChain_Raw_Layers.zip");
      log("Layers successfully downloaded!");
    } catch (err) {
      log(`Error: ${err.message}`);
    }
  }
</script>
</body>
</html>
