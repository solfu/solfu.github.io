<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Chain NFT Layer Downloader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    .form-box { background: #1e293b; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; }
    button { background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .status { text-align: center; color: #38bdf8; margin: 15px 0; word-break: break-all; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .svg-container { width: 140px; height: 140px; background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; }
    .svg-container svg { width: 100%; height: 100%; object-fit: contain; }
    .dl-btn { background: #10b981; margin-top: 10px; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <h1>On-Chain Layer Downloader</h1>
    
    <div class="form-box">
      <input type="text" id="rpcUrl" placeholder="Enter RPC URL (e.g. Robinhood / ETH RPC)" />
      <input type="text" id="contractAddress" placeholder="Enter Diamond Contract Address (0x...)" />
      <button onclick="fetchLayers()">Fetch Layers</button>
    </div>

    <div class="status" id="status"></div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    // ICustomToken Dynamic ABI
    const abi = [
      "function traitTypes(uint256, uint256) view returns (tuple(string traitName, string traitType, string[] pixels, uint256[] pixelCount))"
    ];

    async function fetchLayers() {
      const rpc = document.getElementById('rpcUrl').value.trim();
      const addr = document.getElementById('contractAddress').value.trim();
      const status = document.getElementById('status');
      const grid = document.getElementById('grid');

      grid.innerHTML = "";
      if (!rpc || !addr) return alert("RPC URL এবং Contract Address দিন");

      status.innerText = "Connecting to contract...";

      try {
        const provider = new ethers.JsonRpcProvider(rpc);
        const contract = new ethers.Contract(addr, abi, provider);

        let totalLayers = 0;
        
        // Loop through Categories (0 to 10)
        for (let cat = 0; cat < 15; cat++) {
          let foundInCat = false;
          
          // Loop through Traits in Category (0 to 50)
          for (let idx = 0; idx < 50; idx++) {
            try {
              status.innerText = `Checking Category ${cat}, Index ${idx}...`;
              const trait = await contract.traitTypes(cat, idx);

              if (trait && (trait.traitName || trait[0])) {
                const name = trait.traitName || trait[0];
                const type = trait.traitType || trait[1];
                const pixels = trait.pixels || trait[2];

                if (!name && pixels.length === 0) break;

                foundInCat = true;
                totalLayers++;

                let rawSvg = pixels.join("");
                let svgContent = rawSvg.includes("<svg") ? rawSvg : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">${rawSvg}</svg>`;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                  <div class="svg-container">${svgContent}</div>
                  <strong style="font-size: 12px; color: #38bdf8;">${type || 'Cat ' + cat}</strong>
                  <span style="font-size: 14px; font-weight: bold; margin-top: 4px;">${name || 'Layer ' + idx}</span>
                  <button class="dl-btn" onclick="download('${cat}_${idx}_${name}', \`${encodeURIComponent(svgContent)}\`)">Download SVG</button>
                `;
                grid.appendChild(card);
              }
            } catch (e) {
              console.log(`Cat ${cat} Index ${idx} fetch ended:`, e.message);
              break; // End of this category index
            }
          }
        }

        status.innerText = totalLayers > 0 ? `Done! Loaded ${totalLayers} layers.` : "No layers found. Check RPC URL/Network!";
      } catch (err) {
        console.error(err);
        status.innerText = "Error: " + err.message;
      }
    }

    function download(name, encodedSvg) {
      const blob = new Blob([decodeURIComponent(encodedSvg)], { type: "image/svg+xml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${name}.svg`;
      a.click();
    }
  </script>
</body>
</html>
